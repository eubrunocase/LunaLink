<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${title}">Relatório de Reservas Tarifadas</title>
    <style>
        body { font-family: "ReportFont", sans-serif; font-size: 11px; color: #222; margin: 24px; }
        h1 { text-align: center; font-size: 17px; margin: 0 0 4px 0; }
        .subtitle { text-align: center; color: #666; font-size: 10px; margin: 0 0 20px 0; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #999; padding: 6px 8px; text-align: left; }
        th { background-color: #eee; font-weight: bold; }
    </style>
</head>
<body>
    <h1 th:text="${title}">Relatório de Reservas Tarifadas</h1>
    <p class="subtitle" th:text="${subtitle}"></p>
    <table>
        <thead>
            <tr>
                <th>Morador</th>
                <th>Apartamento</th>
                <th>Data</th>
                <th>Espaço</th>
            </tr>
        </thead>
        <tbody th:utext="${rowsHtml}"></tbody>
    </table>
</body>
</html>
