networks:
  observability-net:
    driver: bridge

services:
  minIO:
    image: minio/minio:latest
    container_name: minIO
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    volumes:
      - minio_data:/data
    networks:
      - observability-net
    command: server /data --console-address ":9001"

  postgres-db:
    image: postgres:14
    container_name: postgres_container

    environment:
      POSTGRES_USER: brunocase
      POSTGRES_PASSWORD: root
      POSTGRES_DB: LunaLink
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - observability-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brunocase"]
      interval: 10s
      timeout: 5s
      retries: 5

  application:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lunalink_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/LunaLink
      SPRING_DATASOURCE_USERNAME: brunocase
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      API_SECURITY_TOKEN_SECRET: ${API_SECURITY_TOKEN_SECRET}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,metrics,prometheus
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
      MINIO_ENDPOINT: http://minIO:9000
      MINIO_PRESIGNED_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: lunalink
    depends_on:
      postgres-db:
        condition: service_healthy
      minIO:
        condition: service_started
    networks:
      - observability-net

volumes:
  grafana-data:
  postgres-data:
  minio_data:
    driver: local